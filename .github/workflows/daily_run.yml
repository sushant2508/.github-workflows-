name: Daily Code Run

on:
  schedule:
    # This runs at 09:15 IST (03:45 UTC) every weekday - before market opens
    - cron: '45 3 * * 1-5'
  workflow_dispatch: # Allows you to also run it manually for testing

jobs:
  daily_scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy ta requests
      
      - name: Run NIFTY50 Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nifty_scanner.py
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_results.txt
          retention-days: 7
